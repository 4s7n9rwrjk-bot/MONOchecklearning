const KEY='monocheck-study-v2';
const seed={"subjects":[{"id":"literature","name":"文学入門","textbook":"","totalPages":414,"contents":[{"title":"解体新書　全現代語訳 / 近代医学への道を開いた書","start":3,"end":6},{"title":"読者への手引き","start":7,"end":16},{"title":"解体新書を出版するにあたっての序文","start":17,"end":23},{"title":"凡例","start":24,"end":37},{"title":"自序","start":38,"end":42},{"title":"巻の一 / 第一　解体大意篇","start":43,"end":45},{"title":"第二　形体名目篇","start":46,"end":54},{"title":"第三　格致篇","start":55,"end":63},{"title":"第四　骨節分類篇","start":64,"end":68},{"title":"第五　骨節篇","start":69,"end":84},{"title":"巻の二 / 第六　頭、ならびに皮毛篇","start":85,"end":88},{"title":"第七　唇口篇","start":89,"end":92},{"title":"第八　脳髄、ならびに神経篇","start":93,"end":102},{"title":"第九　眼目篇","start":103,"end":112},{"title":"第十　耳篇","start":113,"end":118},{"title":"第十一　鼻篇","start":119,"end":122},{"title":"第十二　舌篇","start":123,"end":126},{"title":"巻の三 / 第十三　胸ならびに角膜篇","start":127,"end":131},{"title":"第十四　肺篇","start":132,"end":136},{"title":"第十五　心篇","start":137,"end":141},{"title":"第十六　動脈篇","start":142,"end":145},{"title":"第十七　血脈篇","start":146,"end":150},{"title":"第十八　門脈篇","start":151,"end":155},{"title":"第十九　腹篇","start":156,"end":159},{"title":"第二十　腸胃篇","start":160,"end":165},{"title":"第二十一　下角膜、および液道篇","start":166,"end":169},{"title":"第二十二　大キリイル篇","start":170,"end":172},{"title":"巻の四 / 第二十三　脾篇","start":173,"end":177},{"title":"第二十四　肝胆篇","start":178,"end":182},{"title":"第二十五　腎、膀胱篇","start":183,"end":187},{"title":"第二十六　陰器篇","start":188,"end":193},{"title":"第二十七　妊娠篇","start":194,"end":200},{"title":"第二十八　筋篇","start":201,"end":233},{"title":"『解体新書』の時代","start":234,"end":256},{"title":"前野良沢　生涯一日のごとく / 第二章 / （はじめに）","start":17,"end":18},{"title":"一　前野良沢の出生と家系","start":19,"end":22},{"title":"二　中津藩江戸屋敷と「医師」の格","start":23,"end":25},{"title":"三　オランダ語との出会い","start":26,"end":29},{"title":"四　明和六年の長崎遊学","start":30,"end":44},{"title":"五　長崎遊学の成果","start":45,"end":52},{"title":"第三章 / （はじめに）","start":53,"end":54},{"title":"一　杉田玄白と「ターヘル・アナトミア」","start":55,"end":66},{"title":"二　翻訳開始とその方法","start":67,"end":79},{"title":"三　良沢のオランダ語指導","start":80,"end":94},{"title":"四　『解体新書』完成へ","start":95,"end":112},{"title":"五　良沢にとっての『解体新書』","start":113,"end":124},{"title":"第四章 / （はじめに）","start":125,"end":126},{"title":"一　『解体新書』後の玄白と良沢","start":127,"end":128},{"title":"二　安永時代の著訳書","start":129,"end":148},{"title":"三　大槻玄沢との出会い","start":149,"end":154},{"title":"四　天明時代の良沢の著訳書","start":155,"end":176}],"schedule":[{"date":"2026-09-15","planned":11},{"date":"2026-09-16","planned":10},{"date":"2026-09-17","planned":11},{"date":"2026-09-18","planned":11},{"date":"2026-09-19","planned":0},{"date":"2026-09-20","planned":0},{"date":"2026-09-21","planned":11},{"date":"2026-09-22","planned":11},{"date":"2026-09-23","planned":10},{"date":"2026-09-24","planned":11},{"date":"2026-09-25","planned":11},{"date":"2026-09-26","planned":5},{"date":"2026-09-27","planned":0},{"date":"2026-09-28","planned":11},{"date":"2026-09-29","planned":11},{"date":"2026-09-30","planned":10},{"date":"2026-10-01","planned":11},{"date":"2026-10-02","planned":11},{"date":"2026-10-03","planned":10},{"date":"2026-10-04","planned":0},{"date":"2026-10-05","planned":11},{"date":"2026-10-06","planned":11},{"date":"2026-10-07","planned":10},{"date":"2026-10-08","planned":11},{"date":"2026-10-09","planned":5},{"date":"2026-10-10","planned":10},{"date":"2026-10-11","planned":0},{"date":"2026-10-12","planned":11},{"date":"2026-10-13","planned":11},{"date":"2026-10-14","planned":10},{"date":"2026-10-15","planned":11},{"date":"2026-10-16","planned":11},{"date":"2026-10-17","planned":10},{"date":"2026-10-18","planned":0},{"date":"2026-10-19","planned":11},{"date":"2026-10-20","planned":11},{"date":"2026-10-21","planned":10},{"date":"2026-10-22","planned":11},{"date":"2026-10-23","planned":11},{"date":"2026-10-24","planned":10},{"date":"2026-10-25","planned":0},{"date":"2026-10-26","planned":11},{"date":"2026-10-27","planned":11},{"date":"2026-10-28","planned":10},{"date":"2026-10-29","planned":11},{"date":"2026-10-30","planned":11},{"date":"2026-10-31","planned":8}],"actuals":{"2026-09-15":0,"2026-09-16":4,"2026-09-17":0,"2026-09-18":39,"2026-09-19":0,"2026-09-20":0,"2026-09-21":11,"2026-09-22":12},"notes":{},"reportPrep":[{"id":"q1","title":"設題①","question":"","steps":["","","","","",""]}],"createdFrom":"文学入門　進捗管理表.xlsx"}],"active":"literature","version":2};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let view='home',prepIndex=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function subject(){return data.subjects.find(s=>s.id===data.active)||data.subjects[0]}
function save(force){
  // 画面上で編集中の数値を確実にデータへ取り込んでから保存する
  document.querySelectorAll('[data-plan-date]').forEach(el=>{ setPlanValue(el.dataset.planDate, el.value, false); });
  document.querySelectorAll('[data-actual-date]').forEach(el=>{ setActualValue(el.dataset.actualDate, el.value, false); });
  localStorage.setItem(KEY,JSON.stringify(data));
  localStorage.setItem('monocheck-study-updated',String(Date.now()));
  if(window.queueStudyCloudSync)window.queueStudyCloudSync();
  if(force){ render(); toast('保存しました'); }
}
function planned(s){return s.schedule.reduce((a,x)=>a+(Number(x.planned)||0),0)}
function actual(s){return Object.values(s.actuals).reduce((a,x)=>a+(Number(x)||0),0)}
function total(s){return Number(s.totalPages)||s.contents.reduce((a,x)=>a+Math.max(0,x.end-x.start+1),0)}
function pct(s){return total(s)?Math.min(100,Math.round(actual(s)/total(s)*100)):0}
function renderNav(){let items=[['home','🏠 ホーム'],['study','📖 学習'],['contents','📚 目次・計画'],['daily','🗓️ 日別記録'],['prep','📝 レポート準備'],['subjects','⚙️ 科目管理']];$('#nav').innerHTML=items.map(([k,t])=>`<button class="btn ${view===k?'active':''}" onclick="view='${k}';render()">${t}</button>`).join('')}
function render(){renderNav();let s=subject();({home,study,contents,daily,prep,subjects}[view])(s)}
function home(s){let p=pct(s),a=actual(s),t=total(s),today=new Date().toISOString().slice(0,10),rec=s.schedule.find(x=>x.date===today);$('#main').innerHTML=`<div class="grid"><section class="card span8"><div class="h">${esc(s.name)}</div><div class="muted">教材 ${esc(s.textbook||'未設定')} ／ 全${t}ページ</div><div style="margin:16px 0"><div class="row"><b>学習進捗</b><b>${p}%</b></div><div class="progress"><i style="width:${p}%"></i></div></div><div class="kpi"><div><div class="small">累計実績</div><b>${a}ページ</b></div><div><div class="small">残り</div><b>${Math.max(0,t-a)}ページ</b></div><div><div class="small">今日の予定</div><b>${rec?rec.planned:0}ページ</b></div></div></section><section class="card span4"><div class="h">今日</div>${rec?`<div class="stat">${rec.planned}p</div><div class="muted">${today}</div><button class="btn primary" style="margin-top:12px" onclick="view='daily';render()">実績を入力</button>`:`<div class="muted">今日の予定はありません。</div>`}</section><section class="card span12"><div class="h">このアプリで管理すること</div><div class="list"><div class="item">📚 目次・ページ範囲から学習計画を作成</div><div class="item">🗓️ 日ごとの予定ページと実際に読んだページを記録</div><div class="item">📊 累計・残り・進捗率を自動計算</div><div class="item">📝 レポートは本文を書かず、設題を考えるためのメモだけ残す</div></div></section></div>`}
function study(s){let p=pct(s);let rows=s.schedule.slice(0,14).map(x=>`<tr><td>${x.date}</td><td>${x.planned}p</td><td>${s.actuals[x.date]??''}p</td><td>${x.planned===0?'<span class="pill">休読日</span>':(s.actuals[x.date]!=null?'<span class="pill ok">記録済み</span>':'<span class="pill warn">未入力</span>')}</td></tr>`).join('');$('#main').innerHTML=`<div class="grid"><section class="card span8"><div class="h">📖 学習進捗</div><div class="row"><b>${p}%</b><span class="muted">${actual(s)} / ${total(s)}ページ</span></div><div class="progress" style="margin:8px 0 15px"><i style="width:${p}%"></i></div><div class="muted">予定と実績は日別に管理され、ここから進捗率を自動計算します。</div></section><section class="card span4"><div class="h">計画の状況</div><div class="stat">${planned(s)}p</div><div class="muted">登録されている予定ページ合計</div><button class="btn" style="margin-top:12px" onclick="view='contents';render()">計画を編集</button></section><section class="card span12"><div class="h">直近の学習予定</div><div class="tablewrap"><table class="tbl"><thead><tr><th>日付</th><th>予定</th><th>実績</th><th>状態</th></tr></thead><tbody>${rows||'<tr><td colspan="4">予定がありません。</td></tr>'}</tbody></table></div></section></div>`}
function contents(s){let rows=s.contents.map((c,i)=>`<tr><td><input value="${esc(c.title)}" onchange="s.contents[${i}].title=this.value;syncTotal();save()"></td><td class="num"><input type="number" value="${c.start}" onchange="s.contents[${i}].start=Number(this.value);syncTotal();save()"></td><td class="num"><input type="number" value="${c.end}" onchange="s.contents[${i}].end=Number(this.value);syncTotal();save()"></td><td>${Math.max(0,c.end-c.start+1)}p</td><td><button class="btn danger" onclick="s.contents.splice(${i},1);syncTotal();save();render()">削除</button></td></tr>`).join('');$('#main').innerHTML=`<div class="grid"><section class="card span12"><div class="row"><div><div class="h">📚 目次・学習計画</div><div class="muted">教材の章・項目とページ範囲を登録します。</div></div><button class="btn primary" onclick="addContent()">＋ 項目追加</button></div><div class="tablewrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>項目</th><th>開始</th><th>終了</th><th>ページ数</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="row" style="margin-top:12px"><span><b>教材総ページ数</b> ${total(s)}ページ</span><button class="btn" onclick="generateSchedule()">📅 日程から予定を作る</button></div></section><section class="card span6"><div class="h">📅 予定の作り方</div><div class="field"><label>開始日</label><input id="startDate" type="date" value="${s.schedule[0]?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>1日の基本ページ数</label><input id="dailyPages" type="number" min="1" value="${Math.max(1,Math.round(total(s)/Math.max(1,s.schedule.filter(x=>x.planned>0).length||30)))}"></div><div class="muted">土日を休読日にする場合は生成後、日別記録で予定を0に変更できます。</div></section><section class="card span6"><div class="h">💡 現在のデータ</div><div class="muted">この初期データは「文学入門 進捗管理表.xlsx」の目次・予定・実績をもとに入っています。以後は科目ごとに自由に編集できます。</div></section></div>`}
function daily(s){
  let dates=Array.from(new Set([...s.schedule.map(x=>x.date),...Object.keys(s.actuals)])).sort();
  let rows=dates.map(d=>{
    let sch=s.schedule.find(x=>x.date===d);
    return `<tr><td>${d}</td><td><input class="num" type="number" min="0" data-plan-date="${d}" value="${sch?.planned??0}"></td><td><input class="num" type="number" min="0" data-actual-date="${d}" value="${s.actuals[d]??''}" placeholder="未入力"></td><td>${sch?.planned===0?'<span class="pill">休読日</span>':''}</td></tr>`
  }).join('');
  $('#main').innerHTML=`<div class="grid"><section class="card span12"><div class="row"><div><div class="h">🗓️ 日別記録</div><div class="muted">予定・実績を入力して、上の「保存」でまとめて確定します。保存すると進捗率にも即時反映されます。</div></div><button class="btn primary" onclick="save(true)">保存</button></div><div class="tablewrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>日付</th><th>予定ページ</th><th>実際に読んだページ</th><th>備考</th></tr></thead><tbody>${rows}</tbody></table></div></section></div>`
}
function setActualValue(d,v,shouldSave=true){let s=subject();if(v==='')delete s.actuals[d];else s.actuals[d]=Math.max(0,Number(v)||0);if(shouldSave)save(false)}
function setPlanValue(d,v,shouldSave=true){let s=subject(),x=s.schedule.find(a=>a.date===d);if(!x){x={date:d,planned:Math.max(0,Number(v)||0)};s.schedule.push(x)}else x.planned=Math.max(0,Number(v)||0);if(shouldSave)save(false)}
function setActual(d,v){setActualValue(d,v,true);render()}
function setPlan(d,v){setPlanValue(d,v,true);render()}

function normalizePrep(q){
  if(!q.steps) q.steps=[];
  while(q.steps.length<6) q.steps.push([]);
  q.steps=q.steps.slice(0,6).map((st,si)=>Array.isArray(st)?st.map((e,j)=>typeof e==='string'?{id:'p'+Date.now()+si+j,text:e}:e):[{id:'p'+Date.now()+si,text:String(st||'')}]);
}
function addPrepEntry(q,step){normalizePrep(q);q.steps[step].push({id:'e'+Date.now()+Math.random().toString(36).slice(2,7),text:''});save();render()}
function updatePrepEntry(q,step,id,val){normalizePrep(q);let e=q.steps[step].find(x=>x.id===id);if(e)e.text=val;save()}
function deletePrepEntry(q,step,id){normalizePrep(q);q.steps[step]=q.steps[step].filter(x=>x.id!==id);save();render()}
function prep(s){
  let qs=s.reportPrep||[];
  let q=qs[prepIndex]||qs[0];
  if(!q){$('#main').innerHTML=`<section class="card"><div class="h">📝 レポート準備</div><div class="muted">本文はここでは書かず、Excelと同じ6項目の整理だけを行います。</div><button class="btn primary" style="margin-top:12px" onclick="addPrep()">＋ 設題を追加</button></section>`;return}
  normalizePrep(q);
  const labels=['要は何を答えるのか','何がわかれば答えられる？','教科書のどこから読み取れる？','教科書にはなんと書いてある？','それに対して自分の考えは？','なぜそう思った？'];
  const cols=labels.map((label,i)=>`<div class="prep-col"><div class="prep-head"><span class="prep-no">${i+1}</span><div>${label}</div></div><div class="prep-entries">${q.steps[i].map(e=>`<div class="prep-entry"><textarea oninput="updatePrepEntry(subject(),${i},'${e.id}',this.value)" placeholder="入力してください">${esc(e.text||'')}</textarea><button class="btn danger prep-del" onclick="deletePrepEntry(subject(),${i},'${e.id}')">削除</button></div>`).join('')||'<div class="small">まだ入力はありません</div>'}</div><button class="btn prep-add" onclick="addPrepEntry(subject(),${i})">＋ 追加</button></div>`).join('');
  $('#main').innerHTML=`<div class="grid"><section class="card span12"><div class="row"><div><div class="h">📝 レポート準備</div><div class="muted">元のExcelの形に合わせ、6つの要素を横並びにしています。各列は複数行を追加・編集・削除できます。本文はWordで作成します。</div></div><button class="btn primary" onclick="addPrep()">＋ 設題を追加</button></div><div class="tabs">${qs.map((x,i)=>`<button class="${i===prepIndex?'sel':''}" onclick="prepIndex=${i};render()">${esc(x.title)}</button>`).join('')}</div><div class="field"><label>設題名</label><input value="${esc(q.title)}" onchange="q.title=this.value;save()"></div><div class="field"><label>設題・問い</label><textarea onchange="q.question=this.value;save()">${esc(q.question||'')}</textarea></div></section><section class="card span12"><div class="prep-wrap">${cols}</div></section><section class="card span12"><button class="btn danger" onclick="s.reportPrep.splice(${prepIndex},1);prepIndex=Math.max(0,prepIndex-1);save();render()">この設題を削除</button></section></div>`;
}

function subjects(s){let list=data.subjects.map((x,i)=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small">${total(x)}ページ</div></div><button class="btn ${x.id===data.active?'primary':''}" onclick="data.active='${x.id}';save();render()">${x.id===data.active?'選択中':'選択'}</button></div>`).join('');$('#main').innerHTML=`<div class="grid"><section class="card span6"><div class="h">⚙️ 科目管理</div><div class="list">${list}</div><button class="btn primary" style="margin-top:12px" onclick="addSubject()">＋ 科目を追加</button></section><section class="card span6"><div class="h">選択中：${esc(s.name)}</div><div class="field"><label>科目名</label><input value="${esc(s.name)}" onchange="s.name=this.value;save();render()"></div><div class="field"><label>教材名</label><input value="${esc(s.textbook||'')}" onchange="s.textbook=this.value;save()"></div><div class="field"><label>総ページ数</label><input type="number" value="${total(s)}" onchange="s.totalPages=Number(this.value);save();render()"></div><div class="muted">科目を追加しても、他の科目の学習記録は分離して保存されます。</div></section></div>`}
function syncTotal(){let s=subject();s.totalPages=s.contents.reduce((a,c)=>a+Math.max(0,Number(c.end)-Number(c.start)+1),0);save()}
function addContent(){subject().contents.push({title:'新しい項目',start:1,end:1});syncTotal();render()}
function addSubject(){let id='s'+Date.now();data.subjects.push({id,name:'新しい科目',textbook:'',totalPages:0,contents:[],schedule:[],actuals:{},notes:{},reportPrep:[]});data.active=id;save();render()}
function addPrep(){let s=subject();s.reportPrep=s.reportPrep||[];s.reportPrep.push({id:'q'+Date.now(),title:'設題'+(['①','②','③','④','⑤','⑥'][s.reportPrep.length]||String(s.reportPrep.length+1)),question:'',steps:[[],[],[],[],[],[]]});prepIndex=s.reportPrep.length-1;save();render()}
function setActual(d,v){let s=subject();if(v==='')delete s.actuals[d];else s.actuals[d]=Number(v)||0;save();render()}
function setPlan(d,v){let s=subject(),x=s.schedule.find(a=>a.date===d);if(!x){x={date:d,planned:Number(v)||0};s.schedule.push(x)}else x.planned=Number(v)||0;save();render()}
function generateSchedule(){let s=subject(),start=$('#startDate').value||new Date().toISOString().slice(0,10),per=Math.max(1,Number($('#dailyPages').value)||10),days=Math.ceil(total(s)/per);let arr=[];let cur=new Date(start+'T00:00:00');let left=total(s);for(let i=0;i<days;i++){let d=cur.toISOString().slice(0,10),p=Math.min(per,left);arr.push({date:d,planned:p});left-=p;cur.setDate(cur.getDate()+1)}s.schedule=arr;save();render();alert('学習予定を作成しました。土日など休読日は日別記録で予定を0にできます。')}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MONOcheck_学習管理データ.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.subjects)throw 0;data=x;save();render()}catch{alert('読み込めないデータです。')}};r.readAsText(f)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js");
render();
</script>
<div id="syncModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:430px;width:100%"><div class="row"><div class="h">☁ PC・スマホ同期</div><button class="btn" onclick="closeSyncModal()">閉じる</button></div><div id="syncStatus" class="muted" style="margin-bottom:10px">確認中…</div><div class="field"><label>メールアドレス</label><input id="syncEmail" type="email" autocomplete="email"></div><div class="field"><label>パスワード</label><input id="syncPassword" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn primary" onclick="syncSignIn()">ログイン</button><button class="btn" onclick="syncSignUp()">新規登録</button><button class="btn" onclick="syncNow(true)">今すぐ同期</button><button class="btn danger" onclick="syncSignOut()">ログアウト</button></div><div class="small" style="margin-top:10px">同じアカウントでPCとスマホにログインすると、学習記録・目次・予定・レポート準備が同期されます。</div><div id="syncMessage" class="small" style="margin-top:8px"></div></div></div>
