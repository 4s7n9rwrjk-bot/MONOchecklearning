-10-31","planned":8}],"actuals":{"2026-09-15":0,"2026-09-16":4,"2026-09-17":0,"2026-09-18":39,"2026-09-19":0,"2026-09-20":0,"2026-09-21":11,"2026-09-22":12},"notes":{},"reportPrep":[{"id":"q1","title":"設題①","question":"","steps":["","","","","",""]}],"createdFrom":"文学入門　進捗管理表.xlsx"}],"active":"literature","version":2};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let view='home',prepIndex=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function subject(){return data.subjects.find(s=>s.id===data.active)||data.subjects[0]}
function toast(message='保存しました'){
  const el=document.getElementById('toast');
  if(!el)return;
  el.textContent=message;
  el.style.display='block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{el.style.display='none'},1600);
}
function save(force){
  // 画面上で編集中の数値を確実にデータへ取り込んでから保存する
  document.querySelectorAll('[data-plan-date]').forEach(el=>{ setPlanValue(el.dataset.planDate, el.value, false); });
  document.querySelectorAll('[data-actual-date]').forEach(el=>{ setActualValue(el.dataset.actualDate, el.value, false); });
  localStorage.setItem(KEY,JSON.stringify(data));
  localStorage.setItem('monocheck-study-updated',String(Date.now()));
  if(window.queueStudyCloudSync)window.queueStudyCloudSync();
  if(force){ render(); toast('保存しました'); }
}
function planned(s){return s.schedule.reduce((a,x)=>a+(Number(x.planned)||0),0)}
function actual(s){return Object.values(s.actuals).reduce((a,x)=>a+(Number(x)||0),0)}
function total(s){return Number(s.totalPages)||s.contents.reduce((a,x)=>a+Math.max(0,x.end-x.start+1),0)}
function pct(s){return window.progressPercent?window.progressPercent(s):(window.calcProgress?window.calcProgress(s).percent:(total(s)?Math.min(100,Math.round(actual(s)/total(s)*100)):0))}
function readPages(s){return window.calcProgress?window.calcProgress(s).completedPages:Math.min(total(s),actual(s))}
function remainingPages(s){return window.calcProgress?window.calcProgress(s).remainingPages:Math.max(0,total(s)-actual(s))}
function renderNav(){let items=[['home','🏠 ホーム'],['study','📖 学習'],['contents','📚 目次・計画'],['calendar','📅 予定管理'],['daily','🗓️ 日別記録'],['prep','📝 レポート準備'],['subjects','⚙️ 科目管理']];$('#nav').innerHTML=items.map(([k,t])=>`<button class="btn ${view===k?'active':''}" onclick="view='${k}';render()">${t}</button>`).join('')}

function home(s){let p=pct(s),a=readPages(s),t=total(s),today=new Date().toISOString().slice(0,10),rec=s.schedule.find(x=>x.date===today);$('#main').innerHTML=`<div class="grid"><section class="card span8"><div class="h">${esc(s.name)}</div><div class="muted">教材 ${esc(s.textbook||'未設定')} ／ 全${t}ページ</div><div style="margin:16px 0"><div class="row"><b>学習進捗</b><b>${p}%</b></div><div class="progress"><i style="width:${p}%"></i></div></div><div class="kpi"><div><div class="small">累計実績</div><b>${a}ページ</b></div><div><div class="small">残り</div><b>${remainingPages(s)}ページ</b></div><div><div class="small">今日の予定</div><b>${rec?rec.planned:0}ページ</b></div></div></section><section class="card span4"><div class="h">今日</div>${rec?`<div class="stat">${rec.planned}p</div><div class="muted">${today}</div><button class="btn primary" style="margin-top:12px" onclick="view='daily';render()">実績を入力</button>`:`<div class="muted">今日の予定はありません。</div>`}</section><section class="card span12"><div class="h">このアプリで管理すること</div><div class="list"><div class="item">📚 目次・ページ範囲から学習計画を作成</div><div class="item">🗓️ 日ごとの予定ページと実際に読んだページを記録</div><div class="item">📊 累計・残り・進捗率を自動計算</div><div class="item">📝 レポートは本文を書かず、設題を考えるためのメモだけ残す</div></div></section></div>`}
function study(s){let p=pct(s);let rows=s.schedule.slice(0,14).map(x=>`<tr><td>${x.date}</td><td>${x.planned}p</td><td>${s.actuals[x.date]??''}p</td><td>${x.planned===0?'<span class="pill">休読日</span>':(s.actuals[x.date]!=null?'<span class="pill ok">記録済み</span>':'<span class="pill warn">未入力</span>')}</td></tr>`).join('');$('#main').innerHTML=`<div class="grid"><section class="card span8"><div class="h">📖 学習進捗</div><div class="row"><b>${p}%</b><span class="muted">${readPages(s)} / ${total(s)}ページ</span></div><div class="progress" style="margin:8px 0 15px"><i style="width:${p}%"></i></div><div class="muted">予定と実績は日別に管理され、ここから進捗率を自動計算します。</div></section><section class="card span4"><div class="h">計画の状況</div><div class="stat">${planned(s)}p</div><div class="muted">登録されている予定ページ合計</div><button class="btn" style="margin-top:12px" onclick="view='contents';render()">計画を編集</button></section><section class="card span12"><div class="h">直近の学習予定</div><div class="tablewrap"><table class="tbl"><thead><tr><th>日付</th><th>予定</th><th>実績</th><th>状態</th></tr></thead><tbody>${rows||'<tr><td colspan="4">予定がありません。</td></tr>'}</tbody></table></div></section></div>`}
function contents(s){let rows=s.contents.map((c,i)=>`<tr><td><input value="${esc(c.title)}" onchange="updateContent(${i},'title',this.value)"></td><td class="num"><input type="number" value="${c.start}" onchange="updateContent(${i},'start',this.value)"></td><td class="num"><input type="number" value="${c.end}" onchange="updateContent(${i},'end',this.value)"></td><td>${Math.max(0,c.end-c.start+1)}p</td><td><button class="btn danger" onclick="deleteContent(${i})">削除</button></td></tr>`).join('');$('#main').innerHTML=`<div class="grid"><section class="card span12"><div class="row"><div><div class="h">📚 目次・学習計画</div><div class="muted">教材の章・項目とページ範囲を登録します。</div></div><button class="btn primary" onclick="addContent()">＋ 項目追加</button></div><div class="tablewrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>項目</th><th>開始</th><th>終了</th><th>ページ数</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="row" style="margin-top:12px"><span><b>教材総ページ数</b> ${total(s)}ページ</span><button class="btn" onclick="generateSchedule()">📅 日程から予定を作る</button></div></section><section class="card span6"><div class="h">📅 予定の作り方</div><div class="field"><label>開始日</label><input id="startDate" type="date" value="${s.schedule[0]?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>1日の基本ページ数</label><input id="dailyPages" type="number" min="1" value="${Math.max(1,Math.round(total(s)/Math.max(1,s.schedule.filter(x=>x.planned>0).length||30)))}"></div><div class="muted">土日を休読日にする場合は生成後、日別記録で予定を0に変更できます。</div></section><section class="card span6"><div class="h">💡 現在のデータ</div><div class="muted">この初期データは「文学入門 進捗管理表.xlsx」の目次・予定・実績をもとに入っています。以後は科目ごとに自由に編集できます。</div></section></div>`}
function daily(s){
  let dates=Array.from(new Set([...s.schedule.map(x=>x.date),...Object.keys(s.actuals)])).sort();
  let rows=dates.map(d=>{
    let sch=s.schedule.find(x=>x.date===d);
    return `<tr><td>${d}</td><td><input class="num" type="number" min="0" data-plan-date="${d}" value="${sch?.planned??0}" onchange="setPlan('${d}',this.value)"></td><td><input class="num" type="number" min="0" data-actual-date="${d}" value="${s.actuals[d]??''}" placeholder="未入力" onchange="setActual('${d}',this.value)"></td><td>${sch?.planned===0?'<span class="pill">休読日</span>':''}</td></tr>`
  }).join('');
  $('#main').innerHTML=`<div class="grid"><section class="card span12"><div class="row"><div><div class="h">🗓️ 日別記録</div><div class="muted">予定・実績を入力して、上の「保存」でまとめて確定します。保存すると進捗率にも即時反映されます。</div></div><button class="btn primary" onclick="save(true)">保存</button></div><div class="tablewrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>日付</th><th>予定ページ</th><th>実際に読んだページ</th><th>備考</th></tr></thead><tbody>${rows}</tbody></table></div></section></div>`
}
function setActualValue(d,v,shouldSave=true){let s=subject();if(v==='')delete s.actuals[d];else s.actuals[d]=Math.max(0,Number(v)||0);if(shouldSave)save(false)}
function setPlanValue(d,v,shouldSave=true){let s=subject(),x=s.schedule.find(a=>a.date===d);if(!x){x={date:d,planned:Math.max(0,Number(v)||0)};s.schedule.push(x)}else x.planned=Math.max(0,Number(v)||0);if(shouldSave)save(false)}
function setActual(d,v){setActualValue(d,v,true);render()}
function setPlan(d,v){setPlanValue(d,v,true);render()}

function normalizePrep(q){
  if(!q.steps) q.steps=[];
  while(q.steps.length<6) q.steps.push([]);
  q.steps=q.steps.slice(0,6).map((st,si)=>Array.isArray(st)?st.map((e,j)=>typeof e==='string'?{id:'p'+Date.now()+si+j,text:e}:e):[{id:'p'+Date.now()+si,text:String(st||'')}]);
}
function prepQuestion(){let s=subject();s.reportPrep=s.reportPrep||[];return s.reportPrep[prepIndex]||s.reportPrep[0]||null}
function addPrepEntry(step){let q=prepQuestion();if(!q)return;normalizePrep(q);q.steps[step].push({id:'e'+Date.now()+Math.random().toString(36).slice(2,7),text:''});save();render()}
function updatePrepEntry(step,id,val){let q=prepQuestion();if(!q)return;normalizePrep(q);let e=q.steps[step].find(x=>x.id===id);if(e){e.text=val;save(false)}}
function deletePrepEntry(step,id){let q=prepQuestion();if(!q)return;normalizePrep(q);q.steps[step]=q.steps[step].filter(x=>x.id!==id);save();render()}
function prep(s){
  let qs=s.reportPrep||[];
  let q=qs[prepIndex]||qs[0];
  if(!q){$('#main').innerHTML=`<section class="card"><div class="h">📝 レポート準備</div><div class="muted">本文はここでは書かず、Excelと同じ6項目の整理だけを行います。</div><button class="btn primary" style="margin-top:12px" onclick="addPrep()">＋ 設題を追加</button></section>`;return}
  normalizePrep(q);
  const labels=['要は何を答えるのか','何がわかれば答えられる？','教科書のどこから読み取れる？','教科書にはなんと書いてある？','それに対して自分の考えは？','なぜそう思った？'];
  const cols=labels.map((label,i)=>`<div class="prep-col"><div class="prep-head"><span class="prep-no">${i+1}</span><div>${label}</div></div><div class="prep-entries">${q.steps[i].map(e=>`<div class="prep-entry"><textarea oninput="updatePrepEntry(${i},'${e.id}',this.value)" placeholder="入力してください">${esc(e.text||'')}</textarea><button class="btn danger prep-del" onclick="deletePrepEntry(${i},'${e.id}')">削除</button></div>`).join('')||'<div class="small">まだ入力はありません</div>'}</div><button class="btn prep-add" onclick="addPrepEntry(${i})">＋ 追加</button></div>`).join('');

}

function subjects(s){let list=data.subjects.map((x,i)=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small">${total(x)}ページ</div></div><div class="actions"><button class="btn ${x.id===data.active?'primary':''}" onclick="selectSubject('${x.id}')">${x.id===data.active?'選択中':'選択'}</button><button class="btn danger" onclick="deleteSubject('${x.id}')">削除</button></div></div>`).join('');$('#main').innerHTML=`<div class="grid"><section class="card span6"><div class="h">⚙️ 科目管理</div><div class="list">${list}</div><button class="btn primary" style="margin-top:12px" onclick="addSubject()">＋ 科目を追加</button></section><section class="card span6"><div class="h">選択中：${esc(s.name)}</div><div class="field"><label>科目名</label><input value="${esc(s.name)}" onchange="updateSubjectField('name',this.value)"></div><div class="field"><label>教材名</label><input value="${esc(s.textbook||'')}" onchange="updateSubjectField('textbook',this.value)"></div><div class="field"><label>総ページ数</label><input type="number" value="${total(s)}" onchange="updateSubjectField('totalPages',this.value)"></div><div class="muted">科目を追加しても、他の科目の学習記録は分離して保存されます。科目を削除すると、その科目の目次・予定・実績・レポート準備も一緒に削除されます。</div></section></div>`}
function updateContent(i,key,val){let s=subject();if(!s.contents[i])return;s.contents[i][key]=key==='title'?val:Number(val)||0;syncTotal();render()}
function deleteContent(i){let s=subject();if(!s.contents[i])return;s.contents.splice(i,1);syncTotal();render()}
function updateSubjectField(key,val){let s=subject();if(!s)return;s[key]=key==='name'||key==='textbook'?val:Number(val)||0;save();render()}
function syncTotal(){let s=subject();s.totalPages=s.contents.reduce((a,c)=>a+Math.max(0,Number(c.end)-Number(c.start)+1),0);save()}
function addContent(){subject().contents.push({title:'新しい項目',start:1,end:1});syncTotal();render()}
function addSubject(){let id='s'+Date.now();data.subjects.push({id,name:'新しい科目',textbook:'',totalPages:0,contents:[],schedule:[],actuals:{},notes:{},reportPrep:[]});data.active=id;save();render()}
function selectSubject(id){if(!data.subjects.some(x=>x.id===id))return;data.active=id;save();render()}
function deleteSubject(id){if(data.subjects.length<=1){alert('最後の1科目は削除できません。');return}let i=data.subjects.findIndex(x=>x.id===id);if(i<0)return;let x=data.subjects[i];if(!confirm('「'+x.name+'」を削除しますか？\nこの科目の目次・予定・実績・レポート準備も削除されます。'))return;data.subjects.splice(i,1);if(data.active===id)data.active=data.subjects[Math.min(i,data.subjects.length-1)].id;save();render()}
function addPrep(){let s=subject();s.reportPrep=s.reportPrep||[];s.reportPrep.push({id:'q'+Date.now(),title:'設題'+(['①','②','③','④','⑤','⑥'][s.reportPrep.length]||String(s.reportPrep.length+1)),question:'',steps:[[],[],[],[],[],[]]});prepIndex=s.reportPrep.length-1;save();render()}
function deletePrepQuestion(){let s=subject();if(!s.reportPrep||!s.reportPrep.length)return;if(!confirm('この設題を削除しますか？'))return;s.reportPrep.splice(prepIndex,1);prepIndex=Math.max(0,Math.min(prepIndex,s.reportPrep.length-1));save();render()}
function generateSchedule(){let s=subject(),start=$('#startDate').value||new Date().toISOString().slice(0,10),per=Math.max(1,Number($('#dailyPages').value)||10),days=Math.ceil(total(s)/per);let arr=[];let cur=new Date(start+'T00:00:00');let left=total(s);for(let i=0;i<days;i++){let d=cur.toISOString().slice(0,10),p=Math.min(per,left);arr.push({date:d,planned:p});left-=p;cur.setDate(cur.getDate()+1)}s.schedule=arr;save();render();alert('学習予定を作成しました。土日など休読日は日別記録で予定を0にできます。')}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MONOcheck_学習管理データ.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.subjects)throw 0;data=x;save();render()}catch{alert('読み込めないデータです。')}};r.readAsText(f)}

/* ===== 暦モジュール: 祝日・月齢・六曜(旧暦計算) ===== */
const ROKUYO = ['大安','赤口','先勝','友引','先負','仏滅'];
const sinD = d => Math.sin(d*Math.PI/180);
/* JST 0時 のユリウス日(TT近似) */
function jstJDE(y,m,d){ return Date.UTC(y,m-1,d)/86400000 + 2440587.5 - 9/24; }
function jdeToDateStr(jde){
  const dt = new Date(Math.round((jde + 9/24 - 2440587.5)*86400000));
  return dt.getUTCFullYear()+'-'+pad(dt.getUTCMonth()+1)+'-'+pad(dt.getUTCDate());
}
/* 月の視黄経(Meeus月理論・主要項) */
function moonLon(jde){
  const T=(jde-2451545)/36525, T2=T*T, T3=T2*T, T4=T3*T;
  const D  = 297.8501921 + 445267.1114034*T - 0.0018819*T2 + T3/545868 - T4/147069000;
  const M  = 357.5291092 + 35999.0502909*T - 0.0001536*T2 + T3/24490000;
  const Mp = 134.9633964 + 477198.8675055*T + 0.0087414*T2 + T3/69699 - T4/14712000;
  const F  = 93.2720950 + 483202.0175233*T - 0.0036539*T2 - T3/3526000 + T4/863310000;
  const E  = 1 - 0.002516*T - 0.0000074*T2;
  const Lp = 218.3164477 + 481267.88123421*T - 0.0015786*T2 + T3/538841 - T4/65194000;
  let lon = Lp
    + 6.288774*E*sinD(Mp)
    + 1.274027*sinD(2*D-Mp)
    + 0.658314*sinD(2*D)
    + 0.213618*E*sinD(2*Mp)
    - 0.185116*E*sinD(M)
    - 0.114332*sinD(2*F)
    + 0.058793*sinD(2*D-2*Mp)
    + 0.057066*E*E*sinD(2*D-M-Mp)
    + 0.053322*sinD(2*D+Mp)
    + 0.045758*E*E*sinD(2*D-M)
    - 0.040923*E*sinD(M-Mp)
    - 0.034720*sinD(D)
    - 0.030383*E*E*sinD(M+Mp)
    + 0.015327*sinD(2*D-2*F)
    - 0.012528*E*sinD(Mp+2*F)
    + 0.010980*E*sinD(Mp-2*F)
    + 0.010675*sinD(4*D-Mp)
    + 0.010034*sinD(3*Mp);
  return ((lon%360)+360)%360;
}
/* 黄経差(月-太陽): 0°=新月 */
function elong(jde){ let e = moonLon(jde) - sunLon(jde); e = ((e%360)+360)%360; if (e>180) e-=360; return e; }
/* 新月 JDE: ニュートン法で黄経差=0を解く(近年は±数分精度) */
function newMoonJDE(k){
  let t = 2451550.09766 + 29.530588861*k;
  for(let i=0;i<7;i++){ t -= elong(t)/12.190749; }
  return t;
}
function findNewMoons(jdeFrom, jdeTo){
  const out = [];
  let k = Math.floor((jdeFrom - 2451550.09766)/29.530588861) - 2;
  for(;;){
    const t = newMoonJDE(k);
    if (t > jdeTo) break;
    if (t >= jdeFrom) out.push({k:k, jde:t});
    k++;
  }
  return out;
}
/* 太陽視黄経 */
function sunLon(jde){
  const T = (jde - 2451545.0)/36525;
  const L = 280.46646 + 36000.76983*T + 0.0003032*T*T;
  const M = 357.52911 + 35999.05029*T - 0.0001537*T*T;
  const C = (1.914602 - 0.004817*T - 0.000014*T*T)*sinD(M) + (0.019993 - 0.000101*T)*sinD(2*M) + 0.000289*sinD(3*M);
  const Om = 125.04 - 1934.136*T;
  return ((L + C - 0.00569 - 0.00478*sinD(Om)) % 360 + 360) % 360;
}
function sunLonCross(jde0, target){
  let diff = ((target - sunLon(jde0)) % 360 + 360) % 360;
  let t = jde0 + diff/0.9856;
  for(let i=0;i<3;i++){
    let d2 = ((target - sunLon(t)) % 360 + 360) % 360;
    if (d2 > 180) d2 -= 360;
    t += d2/0.9856;
  }
  return t;
}
/* 旧暦(新月+中気による月名決定)・月齢(その日正午の値) */
const calInfoCache = new Map();
function lunarCalc(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const jde0 = jstJDE(y,m,d);
  const nms = findNewMoons(jde0 - 420, jde0 + 70);

  let idx = -1;
  for (let i=0;i<nms.length-1;i++){ if (d0[i] <= ds && ds < d0[i+1]){ idx = i; break; } }

    const [yy,mm,dd] = d0[i].split('-').map(Number);
    const zd = jdeToDateStr(sunLonCross(jstJDE(yy,mm,dd) - 0.2, target));
    return zd >= d0[i] && zd < d0[i+1];
  };
  const hasAnyZQ = i => { for(let L=0; L<360; L+=30){ if (hasZQ(i,L)) return true; } return false; };
  /* 冬至(黄経270°)を含む月=旧暦11月。そこから前へ遡り、順に月名を決める */
  let wi = idx;
  while (wi >= 0 && !hasZQ(wi, 270)) wi--;
  if (wi < 0) return {monthNum:1, isLeap:false, day:day, age:0};
  let num = 11, isLeap = false;
  for (let i = wi + 1; i <= idx; i++){
    if (hasAnyZQ(i)) { num = num % 12 + 1; isLeap = false; }
    else isLeap = true; /* 中気を含まない月=閏月 */
  }
  const age = (((jde0 + 0.5) - nms[idx].jde) % 29.530588861 + 29.530588861) % 29.530588861;
  return {monthNum:num, isLeap:isLeap, day:day, age:Math.round(age*10)/10};
}
function moonIcon(age){
  if (age < 1.2 || age > 28.3) return '🌑';
  if (age < 6.4) return '🌒';
  if (age < 8.4) return '🌓';
  if (age < 13.8) return '🌔';
  if (age < 15.8) return '🌕';
  if (age < 21.1) return '🌖';
  if (age < 23.1) return '🌗';
  return '🌘';
}
function calInfo(ds){
  if (calInfoCache.has(ds)) return calInfoCache.get(ds);
  const lc = lunarCalc(ds);
  const res = {
    rokuyo: ROKUYO[(lc.monthNum + lc.day) % 6],
    lunarStr: '旧暦 ' + (lc.isLeap ? '閏' : '') + lc.monthNum + '月' + lc.day + '日',
    age: lc.age, icon: moonIcon(lc.age)
  };
  calInfoCache.set(ds, res);
  return res;
}
function nthMonOf(y,mth,n){ const f = new Date(y,mth-1,1); return 1 + (n-1)*7 + ((8 - f.getDay()) % 7); }
/* 国民の祝日(2024〜2030年の計算式対応: 固定日+ハッピーマンデー+春分/秋分+振替休日+国民の休日) */
const holCache = new Map();
function yearHolidays(y){
  if (holCache.has(y)) return holCache.get(y);
  const map = new Map();
  const put = (m,d,n) => { if (m>=1 && m<=12 && d>=1 && d<=31) map.set(m+'-'+d, n); };
  const dim = mm => new Date(y, mm, 0).getDate();
  put(1,1,'元日'); put(1, nthMonOf(y,1,2), '成人の日'); put(2,11,'建国記念の日'); put(2,23,'天皇誕生日');
  const c1980 = y - 1980;
  put(3, Math.floor(20.8431 + 0.242194*c1980 - Math.floor(c1980/4)), '春分の日');
  put(4,29,'昭和の日'); put(5,3,'憲法記念日'); put(5,4,'みどりの日'); put(5,5,'こどもの日');
  put(7, nthMonOf(y,7,3), '海の日'); put(8,11,'山の日'); put(9, nthMonOf(y,9,3), '敬老の日');
  put(9, Math.floor(23.2488 + 0.242194*c1980 - Math.floor(c1980/4)), '秋分の日');
  put(10, nthMonOf(y,10,2), 'スポーツの日'); put(11,3,'文化の日'); put(11,23,'勤労感謝の日');
  /* 振替休日: 日曜に当たった祝日の翌以降で最初の非祝日 */
  [...map.keys()].map(k => k.split('-').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).forEach(pr => {
    if (new Date(y,pr[0]-1,pr[1]).getDay() === 0){
      let dm = pr[0], dd = pr[1] + 1;
      while (map.has(dm+'-'+dd) || new Date(y,dm-1,dd).getDay() === 0){
        dd++; if (dd > dim(dm)){ dm++; dd = 1; }
      }
      put(dm, dd, '振替休日');
    }
  });
  /* 国民の休日: 祝日にはさまれた非日曜日 */
  for (let dt = new Date(y,0,2); dt.getFullYear()===y; dt.setDate(dt.getDate()+1)){
    const m = dt.getMonth()+1, dd = dt.getDate(), key = m+'-'+dd;
    if (map.has(key) || dt.getDay() === 0) continue;
    const pv = new Date(y,m-1,dd-1), nx = new Date(y,m-1,dd+1);
    if (map.has((pv.getMonth()+1)+'-'+pv.getDate()) && map.has((nx.getMonth()+1)+'-'+nx.getDate())){
      map.set(key, '国民の休日');
    }
  }
  holCache.set(y, map);
  return map;
}
function getHolidayName(y,m,d){ return yearHolidays(y).get(m+'-'+d) || null; }

/* ---------- 表示ユーティリティ ---------- */
function catOf(id){ return CATS[id] || CATS.other; }
function sortEv(a,b){ return (a.start + (a.time||'')).localeCompare(b.start + (b.time||'')); }
function datesBetween(s,e){
  const out=[]; let d=parseD(s); const end=parseD(e||s);
  let guard=0;
  while(d<=end && guard<400){ out.push(dstr(d)); d.setDate(d.getDate()+1); guard++; }
  return out;
}
function recurrenceMatches(ev,dateStr){
  if (!ev.recurrence || ev.recurrence.type !== 'weekly') return ev.start <= dateStr && (ev.end||ev.start) >= dateStr;
  const r=ev.recurrence, until=r.until || ev.end || ev.start;
  if(dateStr<ev.start || dateStr>until) return false;
  return Array.isArray(r.weekdays) && r.weekdays.includes(parseD(dateStr).getDay());
}
function eventOccursOn(ev,dateStr){ return recurrenceMatches(ev,dateStr); }
function nextOccurrence(ev,from){
  const base=from||todayStr();
  if(ev.recurrence && ev.recurrence.type==='weekly'){
    const until=ev.recurrence.until || ev.start; let d=parseD(base); if(d<parseD(ev.start)) d=parseD(ev.start);
    for(let i=0;i<370 && dstr(d)<=until;i++,d.setDate(d.getDate()+1)){ if(eventOccursOn(ev,dstr(d))) return dstr(d); }
    return null;
  }
  return (ev.end||ev.start)>=base ? (ev.start>=base?ev.start:base) : null;
}
function eventOn(dateStr){ return events.filter(ev => eventOccursOn(ev,dateStr)); }

/* ---------- MONOcheck 学習予定連携 ---------- */
function learningPlansOn(dateStr){
  try{
    const subjects = typeof window.__monoStudyGetSubjects === 'function' ? window.__monoStudyGetSubjects() : [];
    return subjects.flatMap(s => {
      const rec = Array.isArray(s.schedule) ? s.schedule.find(x => x && x.date === dateStr) : null;
      if (!rec || (Number(rec.planned)||0) <= 0) return [];
      const planned = Number(rec.planned)||0;
      const actual = Number((s.actuals||{})[dateStr])||0;
      return [{subject:s.name||'科目', planned, actual, done:actual>=planned}];
    });
  }catch(e){ return []; }
}
function learningChipText(x){
  return '📚 ' + x.subject + ' ' + x.planned + 'p / ' + x.actual + 'p ' + (x.done ? '既読' : '未読');
}

function esc(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function dstrToJp(s){ const d=parseD(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function jpDow(s){ return '日月火水木金土'[parseD(s).getDay()] + '曜'; }

function renderItem(container, ev, showDone){
  const c = catOf(ev.cat);
  const div = document.createElement('div');
  div.className = 'event-item';
  div.style.borderLeftColor = c.color;
  const period = ev.recurrence && ev.recurrence.type==='weekly'
    ? dstrToJp(ev.start) + '〜' + dstrToJp(ev.recurrence.until || ev.end || ev.start) + ' / 毎週' + (ev.recurrence.weekdays||[]).map(d=>'日月火水木金土'[d]).join('・') + (ev.time ? ' ' + ev.time : '')
    : (ev.end && ev.end!==ev.start ? dstrToJp(ev.start) + '(' + jpDow(ev.start) + ') 〜 ' + dstrToJp(ev.end) + '(' + jpDow(ev.end) + ')' : dstrToJp(ev.start) + '(' + jpDow(ev.start) + ')' + (ev.time ? ' ' + ev.time : ''));
  let daysBadge = '';
  if (!showDone){
    const diff = Math.round((parseD(ev.start) - parseD(todayStr()))/86400000);
    if (diff === 0) daysBadge = '<span class="badge-days" style="color:#fff;background:#c62828;">今日</span>';
    else if (diff === 1) daysBadge = '<span class="badge-days" style="color:#fff;background:#ef6c00;">明日</span>';
    else if (diff > 1 && diff <= 30) daysBadge = '<span class="badge-days">あと'+diff+'日</span>';
    if (diff >= -1 && diff <= 7) div.classList.add('urgent');
  }
  div.innerHTML = '<h4></h4><span class="cat-badge" style="background:'+c.color+'">'+c.label+'</span>' + daysBadge
    + '<div class="event-meta">🗓️ ' + period + '</div>'
    + (ev.place ? '<div class="event-meta">📍 ' + esc(ev.place) + '</div>' : '')
    + (ev.notes ? '<div class="event-notes">' + esc(ev.notes) + '</div>' : '');
  div.querySelector('h4').textContent = ev.title;
  div.onclick = () => openModal(ev.id);
  container.appendChild(div);
}

function renderList(){
  const cont = $('#listContainer'); cont.innerHTML = '';
  const sorted = events.slice().sort(sortEv);
  if (!sorted.length){ cont.innerHTML = '<div class="empty">予定がまだありません。\n右下の ＋ ボタン、または「設定」タブの年間スケジュール一括登録から追加できます。</div>'; return; }
  let lastMonth = '';
  sorted.forEach(ev => {
    const ym = ev.start.slice(0,7);
    if (ym !== lastMonth){
      lastMonth = ym;
      const h = document.createElement('div'); h.className='list-month';
      h.textContent = parseInt(ym.slice(0,4),10) + '年 ' + parseInt(ym.slice(5,7),10) + '月';
      cont.appendChild(h);

    renderItem(cont, ev, true);
  });
}

  const cont = $('#upcomingContainer'); cont.innerHTML = '';

  if (!up.length){ cont.innerHTML = '<div class="empty">今日以降の予定はまだありません。</div>'; return; }

      const list = [];
      BUKYO_EXAMS.forEach(x => {
        const s = bukyoDate(x[1], x[2]), e = bukyoDate(x[3], x[4]);
        if (e < todayStr()) return;
        list.push(makeEv(x[0]+'月科目最終試験', 'exam', s, e, '受験資格: 前月までに設題をすべて提出・受理。\n合格時の単位認定日: '+x[5], 'exam-'+s));
      });
      bulkAdd(list);
    } else if (kind === 'credits'){
      const list = [];
      BUKYO_CREDITS.forEach(x => {
        const d = (BUKYO_Y + x[2]) + '-' + pad(x[0]) + '-' + pad(x[1]);
        if (d < todayStr()) return;
        list.push(makeEv('単位認定日('+x[3]+'に合格した科目)', 'credit', d, '', '佛大通信の単位認定日。', 'credit-'+d));
      });
      bulkAdd(list);
    }
  };
});
$('#fCat').onchange = () => { if (!editingId) $('#fNotes').value = REF_TEXT[$('#fCat').value] || ''; };

/* ---------- JSON 書き出し / 取り込み ---------- */
$('#exportJsonBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(events, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yotei-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw new Error('array expected');
      const merge = confirm('既存の予定に追加(マージ)しますか?\n[OK]=追加 / [キャンセル]=このファイルの内容で置き換え');
      if (merge){
        const ids = new Set(events.map(x=>x.id));
        data.forEach(x=>{ if(x && x.title && x.start && !ids.has(x.id)) events.push(x); });
      } else {
        events = data.filter(x=>x && x.title && x.start);
      }
      saveLocal(); fbPush(); renderAll();
      alert('取り込みが完了しました(現在 ' + events.length + ' 件)。');
    } catch(err){ alert('JSONの読み込みに失敗しました: ' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
};

/* ---------- .ics 書き出し ---------- */
$('#exportIcsBtn').onclick = () => {
  if (!events.length){ alert('予定がありません。'); return; }
  const fold = line => line.length > 73 ? line.match(/.{1,73}/g).join('\r\n ') : line;
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//yotei-app//JP//','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  events.forEach(ev => {
    const c = catOf(ev.cat);
    const uid = ev.id + '@yotei-local';
    const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    if (ev.end && ev.end !== ev.start){
      const eEnd = dstr(new Date(parseD(ev.end).getTime()+86400000));
      lines.push('BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+stamp,
        'DTSTART;VALUE=DATE:'+ev.start.replace(/-/g,''),
        'DTEND;VALUE=DATE:'+eEnd.replace(/-/g,''),
        fold('SUMMARY:'+c.short+'｜'+ev.title),
        fold('DESCRIPTION:'+(ev.notes||'')));
      if (ev.place) lines.push(fold('LOCATION:'+ev.place));
      lines.push('END:VEVENT');
    } else {
      const dt = ev.start.replace(/-/g,'') + 'T' + (ev.time ? ev.time.replace(':','') + '00' : '090000');
      lines.push('BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+stamp,
        'DTSTART:'+dt, 'DTEND:'+dt,
        fold('SUMMARY:'+c.short+'｜'+ev.title),
        fold('DESCRIPTION:'+(ev.notes||'')));
      if (ev.place) lines.push(fold('LOCATION:'+ev.place));
      lines.push('END:VEVENT');
    }
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yotei-' + todayStr() + '.ics';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ---------- 全消去 ---------- */
$('#clearAllBtn').onclick = () => {
  if (!confirm('この端末の全予定を削除します。よろしいですか?')) return;
  if (!confirm('本当に削除しますか?(取り消せません)')) return;
  events = [];
  saveLocal(); fbPush(); renderAll();
};
